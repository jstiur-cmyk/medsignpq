{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<div class="auth-wrap container">
  <form class="form-card" method="post">
    <h1>Masuk</h1>
    <p class="sub">Masuk ke akun fasyankes Anda untuk menandatangani citra.</p>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" required>
    <label for="password">Kata sandi</label>
    <input type="password" id="password" name="password" required>
    <button class="btn btn-primary btn-block" style="margin-top:22px" type="submit">Masuk</button>
    <p class="hint" style="text-align:center;margin-top:14px">Belum punya akun? <a href="{{ url_for('register') }}">Daftar gratis</a></p>
  </form>
</div>
{% endblock %}
