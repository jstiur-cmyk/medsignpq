{% extends "base.html" %}
{% block title %}Daftar{% endblock %}
{% block content %}
<div class="auth-wrap container">
  <form class="form-card" method="post" novalidate>
    <h1>Daftar Fasyankes</h1>
    <p class="sub">Gratis uji coba 3 bulan, maksimal 300 citra per bulan.</p>
    <label for="org_name">Nama fasyankes</label>
    <input type="text" id="org_name" name="org_name" value="{{ form.get('org_name','') }}" placeholder="Contoh: Klinik Pratama Sehat Laguboti" required>
    <label for="org_type">Jenis fasyankes</label>
    <select id="org_type" name="org_type" required>
      <option value="">-- Pilih --</option>
      {% for t in org_types %}<option {{ 'selected' if form.get('org_type')==t }}>{{ t }}</option>{% endfor %}
    </select>
    <div class="row-2">
      <div><label for="pic_name">Nama penanggung jawab</label>
        <input type="text" id="pic_name" name="pic_name" value="{{ form.get('pic_name','') }}" required></div>
      <div><label for="phone">No. WhatsApp</label>
        <input type="tel" id="phone" name="phone" value="{{ form.get('phone','') }}" placeholder="08xxxxxxxxxx"></div>
    </div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.get('email','') }}" required>
    <div class="row-2">
      <div><label for="password">Kata sandi</label><input type="password" id="password" name="password" required><div class="hint">Minimal 8 karakter</div></div>
      <div><label for="confirm">Ulangi kata sandi</label><input type="password" id="confirm" name="confirm" required></div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:22px" type="submit">Buat Akun</button>
    <p class="hint" style="text-align:center;margin-top:14px">Sudah punya akun? <a href="{{ url_for('login') }}">Masuk</a></p>
  </form>
</div>
{% endblock %}
